name: VIEW crisp audio settings patch

on:
  push:
    branches:
      - fix/view-crisp-audio-settings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/view-crisp-audio-settings
      - name: Apply patch
        run: |
          echo '' | base64 -d | python
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/view-crisp-audio.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: sharpen VIEW and add public audio-react settings"
          git push origin HEAD:fix/view-crisp-audio-settings
