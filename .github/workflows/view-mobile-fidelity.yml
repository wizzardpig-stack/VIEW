name: VIEW mobile fidelity patch

on:
  push:
    branches:
      - fix/view-mobile-fidelity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/view-mobile-fidelity
      - name: Patch VIEW mobile fidelity
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          def rep(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'missing expected source for {label}')
              s = s.replace(old, new, 1)

          rep(
              'const w = MOBILE_DEVICE ? 1440 : 1920, q = MOBILE_DEVICE ? 80 : 85;',
              'const w = MOBILE_DEVICE ? 2400 : 2400, q = MOBILE_DEVICE ? 88 : 88;',
              'retina source images')

          rep(
              '#devToggle:hover { opacity:1; }\n  body.prod #devToggle { display:none; }',
              '#devToggle:hover { opacity:1; }\n  body:not(.dev-mode) #devToggle, body:not(.dev-mode) #devPanel { display:none !important; }',
              'dev gating css')

          rep(
              '    body.flow-active #viewer { filter:none; }\n    #overlayFx::before { filter:blur(22px); }\n    #overlayFx::after { filter:blur(28px); }',
              '    body.flow-active #viewer { filter:none; }\n    #viewer,#gl,#camWrap,body.flow-active #viewer,body.flow-active #gl,body.flow-active #camWrap { animation:none!important; transform:none!important; }\n    #overlayFx::before { filter:blur(14px); opacity:.055; }\n    #overlayFx::after { filter:blur(18px); opacity:.035; }\n    body.fx-lite #overlayFx::before { filter:blur(10px); opacity:.035; }\n    body.fx-lite #overlayFx::after { display:none; }',
              'mobile compositor sharpness')

          rep(
              '    UI.loading.classList.remove("hidden");\n    UI.selector.classList.add("hidden");\n\n    await Promise.all([loadAsset(IMG(w.scenes[this.from].src)), loadAsset(IMG(w.scenes[this.to].src))]);\n    this.meta = pairMeta(w, this.from, this.to);',
              '    UI.loading.classList.add("hidden");\n\n    const fromSrc = IMG(w.scenes[this.from].src);\n    const toSrc = IMG(w.scenes[this.to].src);\n    const first = await loadAsset(fromSrc);\n    if (!first || first.failed || !first.ready) return;\n    UI.selector.classList.add("hidden");\n    document.body.classList.add("view-entered");\n    loadAsset(toSrc).then(() => this.preloadAhead());\n\n    this.meta = pairMeta(w, this.from, this.to);',
              'nonblocking world entry')

          rep(
              '    setTimeout(() => UI.loading.classList.add("hidden"), 260);\n    UI.showUI(2400);',
              '    UI.loading.classList.add("hidden");\n    UI.showUI(2400);',
              'remove world loading flash')

          rep(
              '    const recA = assets.get(IMG(a.src)), recB = assets.get(IMG(b.src));\n    if (!recA || !recA.ready) return null;\n    recA.used = performance.now(); if (recB) recB.used = performance.now();',
              '    const recA = assets.get(IMG(a.src)), recB0 = assets.get(IMG(b.src));\n    if (!recA || !recA.ready) return null;\n    const recB = recB0 && recB0.ready ? recB0 : null;\n    recA.used = performance.now(); if (recB) recB.used = performance.now();',
              'safe next texture fallback')

          rep(
              '  beginMorph() {\n    const w = this.world();\n    this.meta = pairMeta(w, this.from, this.to);',
              '  beginMorph() {\n    const w = this.world();\n    const nextRec = assets.get(IMG(w.scenes[this.to].src));\n    if (!nextRec || !nextRec.ready) {\n      loadAsset(IMG(w.scenes[this.to].src));\n      this.holdLeft = 0.75;\n      return;\n    }\n    this.meta = pairMeta(w, this.from, this.to);',
              'wait for destination texture')

          rep(
              'if (/[?&]prod\\b/.test(location.search)) document.body.classList.add("prod");',
              'const DEV_MODE = /[?&]dev=1(?:&|$)/.test(location.search);\nif (DEV_MODE) document.body.classList.add("dev-mode");',
              'production default')

          rep(
              'Renderer.dprCap = mobile ? 1.25 : 1.5;\nEngine.quality = mobile ? 1 : 2;',
              'Renderer.dprCap = mobile ? 2.0 : 1.75;\nEngine.quality = mobile ? 1 : 2;',
              'retina dpr')

          rep(
              '    // Adaptive quality: protect the illusion by protecting the frame rate (§32)\n    if (Engine.fps < 34 && Engine.quality > 0) {\n      Engine.quality--;\n      Renderer.dprCap = Math.max(0.8, Renderer.dprCap - 0.3);\n      Renderer.w = 0; Renderer.resize();\n    }',
              '    // Preserve Retina clarity: reduce shader/atmosphere cost before render resolution.\n    if (Engine.fps < 34) {\n      if (Engine.quality > 0) {\n        Engine.quality--;\n      } else if (!document.body.classList.contains("fx-lite")) {\n        document.body.classList.add("fx-lite");\n      } else if (Renderer.dprCap > 1.5) {\n        Renderer.dprCap = Math.max(1.5, Renderer.dprCap - 0.25);\n        Renderer.w = 0; Renderer.resize();\n      }\n    }',
              'effect-first adaptive quality')

          rep(
              '  else if (k === "n") Dev.jump(Engine.from + 1);\n  else if (k === "p") Dev.jump(Engine.from - 1);\n  else if (k === "d") Dev.toggle();\n  else if (k === "s") { if (Engine.scrub == null) { Engine.scrub = 0; Dev.el.scrub.value = "0"; } else Dev.releaseScrub(); }\n  else if (k === "g") {  // glance test: jump forward ten minutes of world time',
              '  else if (DEV_MODE && k === "n") Dev.jump(Engine.from + 1);\n  else if (DEV_MODE && k === "p") Dev.jump(Engine.from - 1);\n  else if (DEV_MODE && k === "d") Dev.toggle();\n  else if (DEV_MODE && k === "s") { if (Engine.scrub == null) { Engine.scrub = 0; Dev.el.scrub.value = "0"; } else Dev.releaseScrub(); }\n  else if (DEV_MODE && k === "g") {  // glance test: jump forward ten minutes of world time',
              'gate dev shortcuts')

          rep(
              '  else if (e.key === "]") Dev.setSpeed(Dev.SPEEDS[Math.min(Dev.SPEEDS.length-1, Dev.SPEEDS.indexOf(Engine.timeScale)+1)]);\n  else if (e.key === "[") Dev.setSpeed(Dev.SPEEDS[Math.max(0, Dev.SPEEDS.indexOf(Engine.timeScale)-1)]);\n  else if (e.key === "1") Dev.setSpeed(1);',
              '  else if (DEV_MODE && e.key === "]") Dev.setSpeed(Dev.SPEEDS[Math.min(Dev.SPEEDS.length-1, Dev.SPEEDS.indexOf(Engine.timeScale)+1)]);\n  else if (DEV_MODE && e.key === "[") Dev.setSpeed(Dev.SPEEDS[Math.max(0, Dev.SPEEDS.indexOf(Engine.timeScale)-1)]);\n  else if (DEV_MODE && e.key === "1") Dev.setSpeed(1);',
              'gate dev speed shortcuts')

          p.write_text(s)
          Path('.github/workflows/view-mobile-fidelity.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/view-mobile-fidelity.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: sharpen VIEW mobile rendering and world transitions"
          git push origin HEAD:fix/view-mobile-fidelity
